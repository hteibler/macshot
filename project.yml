name: macshot
options:
  bundleIdPrefix: at.teibler
  deploymentTarget:
    macOS: "14.0"
targets:
  macshot:
    type: application
    platform: macOS
    sources:
      - macshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.teibler.macshot
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: macshot/Info.plist
      properties:
        CFBundleDisplayName: macshot
        LSUIElement: true
